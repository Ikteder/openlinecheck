[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlinecheck"
version = "0.1.0"
description = "Zero-dependency speed testing and read-only network diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "OpenLineCheck contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
]

[project.scripts]
linecheck = "linecheck.cli:main"

[tool.setuptools]
packages = ["linecheck"]
